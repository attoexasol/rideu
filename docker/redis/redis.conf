# DriveWize production Redis — cache, Socket.IO adapter, rate limits, pub/sub.
# Application source of truth remains PostgreSQL.
# Password is injected at container start via --requirepass (see compose).

bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Persistence: AOF preferred for session-ish keys; RDB snapshots as backup
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# Memory budget for 8 GB VPS (leave headroom for Postgres + Node + OS).
# App keys that matter for ops always set TTL via SETEX / PEXPIRE:
#   location:driver:*, status:driver:*, heartbeat:driver:*, session:*,
#   maps:*, rl:* (rate-limit store).
# Pub/Sub does not rely on durable keys.
maxmemory 512mb

# Evict only keys that have an expire set. Prefer this over allkeys-lru so a
# forgotten non-TTL key (or future critical key without TTL) is not silently
# removed under pressure. If memory fills with non-TTL keys, writes fail
# (OOM) rather than dropping rate-limit / presence keys unpredictably.
# Application rate-limit store already fail-opens when Redis errors.
maxmemory-policy volatile-lru

# Logging
loglevel notice
