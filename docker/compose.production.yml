# DriveWize backend — production stack (Hostinger VPS: /opt/drivewize/production)
#
# Public ports: Caddy 80/443 only. Postgres, Redis, and backend:3000 stay on
# the private Docker network.
#
# Usage (on VPS):
#   cd /opt/drivewize/production
#   ./scripts/deploy/production-deploy.sh
#
# Local validation (repo root):
#   docker compose -f docker/compose.production.yml --env-file docker/env/production.env.example config

name: drivewize-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-restart: &default-restart
  unless-stopped

services:
  postgres:
    image: postgres:17.12-alpine
    restart: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ryd_u}
      POSTGRES_USER: ${POSTGRES_USER:-drivewize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - production_pgdata:/var/lib/postgresql/data
    networks:
      - drivewize_production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M

  redis:
    image: redis:7.4.12-alpine
    restart: *default-restart
    logging: *default-logging
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - production_redisdata:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - drivewize_production
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 640M
        reservations:
          cpus: "0.10"
          memory: 128M

  # One-shot migrator. Prefer: docker compose run --rm migrate
  # MIGRATE_IMAGE must be built from the same git commit as BACKEND_IMAGE.
  migrate:
    image: ${MIGRATE_IMAGE:-ghcr.io/attoexasol/rideu:production-migrate}
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrate
      args:
        NODE_VERSION: "22.23.5"
    restart: "no"
    logging: *default-logging
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MIGRATIONS_FOLDER: /app/src/db/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - drivewize_production
    profiles:
      - migrate

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/attoexasol/rideu:production}
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
      args:
        NODE_VERSION: "22.23.5"
    restart: *default-restart
    logging: *default-logging
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      USE_REDIS: "true"
      RATE_LIMIT_USE_REDIS: "true"
      VIDEO_STORAGE_ROOT: /app/private-media
      DRIVER_DOCUMENT_STORAGE_ROOT: /app/private-media
      AVATAR_STORAGE_ROOT: /app/uploads
      MIGRATIONS_FOLDER: /app/src/db/migrations
    volumes:
      - production_private_media:/app/private-media
      - production_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - drivewize_production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1280M
        reservations:
          cpus: "0.25"
          memory: 512M

  caddy:
    image: caddy:2.11.9-alpine
    restart: *default-restart
    logging: *default-logging
    # Default bind 127.0.0.1 = HTTP only via SSH tunnel (not public).
    # After domain purchase set CADDY_BIND_ADDRESS=0.0.0.0 and enable HTTPS in env.
    ports:
      - "${CADDY_BIND_ADDRESS:-127.0.0.1}:${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_BIND_ADDRESS:-127.0.0.1}:${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_BIND_ADDRESS:-127.0.0.1}:${CADDY_ADMIN_HTTP_PORT:-8081}:8081"
    environment:
      # Defaults live in production.env.example (:80 / :8081). Avoid ${VAR:-:80}
      # here — Compose treats the extra colon as ambiguous.
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?CADDY_SITE_ADDRESS is required (e.g. :80)}
      ADMIN_SITE_ADDRESS: ${ADMIN_SITE_ADDRESS:?ADMIN_SITE_ADDRESS is required (e.g. :8081)}
      CADDY_AUTO_HTTPS: ${CADDY_AUTO_HTTPS:-off}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-ops@drivewize.co}
    volumes:
      - ./caddy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - production_caddy_data:/data
      - production_caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - drivewize_production
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  # Admin (separate repository). Uncomment when the Admin image is ready.
  # admin:
  #   image: ${ADMIN_IMAGE:-ghcr.io/attoexasol/drivewize-admin:production}
  #   restart: *default-restart
  #   logging: *default-logging
  #   networks:
  #     - drivewize_production
  #   depends_on:
  #     - backend

networks:
  drivewize_production:
    driver: bridge
    name: drivewize_production

volumes:
  production_pgdata:
    name: drivewize_production_pgdata
  production_redisdata:
    name: drivewize_production_redisdata
  production_private_media:
    name: drivewize_production_private_media
  production_uploads:
    name: drivewize_production_uploads
  production_caddy_data:
    name: drivewize_production_caddy_data
  production_caddy_config:
    name: drivewize_production_caddy_config
