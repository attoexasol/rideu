openapi: 3.0.3
info:
  title: Admin Ride Video API
  version: 1.0.0
  description: Admin monitoring and secure playback for booking-linked ride recordings.
servers:
  - url: http://localhost:3000/api/v1/admin
    description: Local development
paths:
  /ride-videos:
    get:
      summary: List recording sessions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: bookingId
          schema: { type: string, format: uuid }
        - in: query
          name: recordingStatus
          schema: { type: string }
        - in: query
          name: consentStatus
          schema:
            type: string
            enum: [not_required, pending, granted, denied, revoked, required]
        - in: query
          name: uploadHealth
          schema:
            type: string
            enum:
              [
                healthy,
                delayed,
                missing_segments,
                failed_segments,
                duplicate_segments,
                incomplete,
                unknown,
              ]
        - in: query
          name: dateFrom
          schema: { type: string, format: date-time }
        - in: query
          name: dateTo
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Paginated session list
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden / missing permission
  /ride-videos/summary:
    get:
      summary: Operational summary counts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Summary metrics
  /ride-videos/{sessionId}:
    get:
      summary: Session detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: Session detail
        '404':
          description: Session not found
  /bookings/{bookingId}/ride-video:
    get:
      summary: Booking-linked recording summary
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/bookingId'
      responses:
        '200':
          description: Session or absence reason
  /ride-videos/{sessionId}/segments:
    get:
      summary: List segments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: Segment list with missingSequences
  /ride-videos/{sessionId}/health:
    get:
      summary: Recording health
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: Health summary
  /ride-videos/{sessionId}/timeline:
    get:
      summary: Unified timeline
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: Timeline events
  /ride-videos/{sessionId}/playback-manifest:
    post:
      summary: Lazy signed playback window
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/sessionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                fromIndex: { type: integer, minimum: 0 }
                limit: { type: integer, minimum: 1, maximum: 30 }
      responses:
        '200':
          description: Manifest window
        '403':
          description: Missing play permission
        '409':
          description: Not ready
        '410':
          description: Expired or deleted
  /ride-videos/{sessionId}/segments/{segmentId}/playback-url:
    post:
      summary: Refresh segment signed URL
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/sessionId'
        - $ref: '#/components/parameters/segmentId'
      responses:
        '200':
          description: Signed URL
  /ride-videos/{sessionId}/audit:
    get:
      summary: Audit log
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: Audit entries
  /ride-videos/{sessionId}/download:
    post:
      summary: Combined download (unsupported)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '409':
          description: COMBINED_DOWNLOAD_NOT_AVAILABLE
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    sessionId:
      in: path
      name: sessionId
      required: true
      schema: { type: string, format: uuid }
    bookingId:
      in: path
      name: bookingId
      required: true
      schema: { type: string, format: uuid }
    segmentId:
      in: path
      name: segmentId
      required: true
      schema: { type: string, format: uuid }
