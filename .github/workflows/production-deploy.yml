name: Production deploy

# Direct CI/CD from main → /opt/drivewize/production
# Failed CI gate prevents image push and VPS deploy. No continue-on-error on tests.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: "22.23.5"

jobs:
  ci-gate:
    name: CI gate (same commit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: drivewize_ci
          POSTGRES_PASSWORD: drivewize_ci
          POSTGRES_DB: drivewize_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drivewize_ci -d drivewize_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.12-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: "3000"
      DATABASE_URL: postgresql://drivewize_ci:drivewize_ci@localhost:5432/drivewize_ci
      REDIS_URL: redis://localhost:6379
      USE_REDIS: "true"
      JWT_SECRET: CHANGE_ME_CI_JWT_SECRET_AT_LEAST_32_CHARS_00
      BYPASS_AUTH: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Ensure credential files are not tracked
        run: |
          tracked="$(git ls-files -- .env .env.local .env.production .env.staging 'secrets/*' '*.pem' '*.key' '*.dump' || true)"
          if [ -n "$tracked" ]; then
            echo "Refusing to continue: credential/dump files are tracked:"
            echo "$tracked"
            exit 1
          fi
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
      - run: ./gitleaks detect --source . --no-git --redact --exit-code 1 -c .gitleaks.toml
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand --forceExit
      - run: npm run build

  build-and-push:
    name: Build and push GHCR images
    needs: [ci-gate]
    runs-on: ubuntu-latest
    outputs:
      runtime_ref: ${{ steps.digest_refs.outputs.runtime_ref }}
      migrate_ref: ${{ steps.digest_refs.outputs.migrate_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        run: |
          SHA_TAG="sha-${GITHUB_SHA}"
          IMAGE_LC="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "image_base=${IMAGE_LC}" >>"$GITHUB_OUTPUT"
          echo "runtime_ref=${IMAGE_LC}:${SHA_TAG}" >>"$GITHUB_OUTPUT"
          echo "migrate_ref=${IMAGE_LC}:${SHA_TAG}-migrate" >>"$GITHUB_OUTPUT"
          echo "runtime_tags=${IMAGE_LC}:${SHA_TAG},${IMAGE_LC}:production" >>"$GITHUB_OUTPUT"
          echo "migrate_tags=${IMAGE_LC}:${SHA_TAG}-migrate,${IMAGE_LC}:production-migrate" >>"$GITHUB_OUTPUT"
      - name: Build and push runtime
        id: build_runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.runtime_tags }}
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Build and push migrate (same commit)
        id: build_migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: migrate
          push: true
          tags: ${{ steps.meta.outputs.migrate_tags }}
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
          provenance: false
      - name: Trivy scan runtime
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.runtime_ref }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Prefer immutable digest refs
        id: digest_refs
        run: |
          BASE="${{ steps.meta.outputs.image_base }}"
          RT_DIGEST="${{ steps.build_runtime.outputs.digest }}"
          MG_DIGEST="${{ steps.build_migrate.outputs.digest }}"
          if [ -n "$RT_DIGEST" ]; then
            echo "runtime_ref=${BASE}@${RT_DIGEST}" >>"$GITHUB_OUTPUT"
          else
            echo "runtime_ref=${{ steps.meta.outputs.runtime_ref }}" >>"$GITHUB_OUTPUT"
          fi
          if [ -n "$MG_DIGEST" ]; then
            echo "migrate_ref=${BASE}@${MG_DIGEST}" >>"$GITHUB_OUTPUT"
          else
            echo "migrate_ref=${{ steps.meta.outputs.migrate_ref }}" >>"$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to production VPS
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH with pinned host key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/production_deploy
          chmod 600 ~/.ssh/production_deploy
          echo "${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host drivewize-production
            HostName ${{ secrets.PRODUCTION_SSH_HOST }}
            User ${{ secrets.PRODUCTION_SSH_USER }}
            IdentityFile ~/.ssh/production_deploy
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            IdentitiesOnly yes
          EOF
      - name: Sync deployment config to VPS
        env:
          REMOTE_DIR: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh drivewize-production "mkdir -p \"$REMOTE_DIR/docker/caddy\" \"$REMOTE_DIR/docker/redis\" \"$REMOTE_DIR/docker/env\" \"$REMOTE_DIR/scripts/deploy\" \"$REMOTE_DIR/backups/production\""
          scp docker/compose.production.yml "drivewize-production:$REMOTE_DIR/docker/compose.production.yml"
          scp docker/caddy/Caddyfile.production "drivewize-production:$REMOTE_DIR/docker/caddy/Caddyfile.production"
          scp docker/redis/redis.conf "drivewize-production:$REMOTE_DIR/docker/redis/redis.conf"
          scp docker/env/production.env.example "drivewize-production:$REMOTE_DIR/docker/env/production.env.example"
          scp scripts/deploy/production-deploy.sh "drivewize-production:$REMOTE_DIR/scripts/deploy/production-deploy.sh"
          scp scripts/deploy/production-rollback.sh "drivewize-production:$REMOTE_DIR/scripts/deploy/production-rollback.sh"
          ssh drivewize-production "chmod +x \"$REMOTE_DIR/scripts/deploy/production-deploy.sh\" \"$REMOTE_DIR/scripts/deploy/production-rollback.sh\""
      - name: GHCR login on VPS
        run: |
          ssh drivewize-production "echo '${{ secrets.GHCR_READ_TOKEN }}' | docker login ghcr.io -u '${{ secrets.GHCR_USERNAME }}' --password-stdin"
      - name: Remote deploy
        env:
          REMOTE_DIR: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          RUNTIME_REF: ${{ needs.build-and-push.outputs.runtime_ref }}
          MIGRATE_REF: ${{ needs.build-and-push.outputs.migrate_ref }}
        run: |
          set -euo pipefail
          ssh drivewize-production "test -f \"$REMOTE_DIR/.env.production\""
          ssh drivewize-production "cd \"$REMOTE_DIR\" && \
            grep -q '^BACKEND_IMAGE=' .env.production && \
            sed -i \"s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${RUNTIME_REF}|\" .env.production || \
            echo \"BACKEND_IMAGE=${RUNTIME_REF}\" >> .env.production"
          ssh drivewize-production "cd \"$REMOTE_DIR\" && \
            grep -q '^MIGRATE_IMAGE=' .env.production && \
            sed -i \"s|^MIGRATE_IMAGE=.*|MIGRATE_IMAGE=${MIGRATE_REF}|\" .env.production || \
            echo \"MIGRATE_IMAGE=${MIGRATE_REF}\" >> .env.production"
          ssh drivewize-production "cd \"$REMOTE_DIR\" && ./scripts/deploy/production-deploy.sh"
      - name: Production health
        # Loopback only — matches CADDY_BIND_ADDRESS=127.0.0.1 (SSH-tunnel / IP mode).
        run: |
          ssh drivewize-production 'curl -fsS http://127.0.0.1:80/api/health || curl -fsS http://127.0.0.1/api/health'
