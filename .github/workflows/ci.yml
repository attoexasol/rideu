name: CI

# Pull-request validation only. Production deploy runs on push to main
# via production-deploy.yml (includes its own CI gate).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  security-events: write

env:
  NODE_VERSION: "22.23.5"

jobs:
  secret-scan:
    name: Secret scan (working tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
      - run: ./gitleaks detect --source . --no-git --redact --exit-code 1

  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    needs: [secret-scan]
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: drivewize_ci
          POSTGRES_PASSWORD: drivewize_ci
          POSTGRES_DB: drivewize_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drivewize_ci -d drivewize_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.12-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: "3000"
      DATABASE_URL: postgresql://drivewize_ci:drivewize_ci@localhost:5432/drivewize_ci
      REDIS_URL: redis://localhost:6379
      USE_REDIS: "true"
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      BYPASS_AUTH: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand --forceExit
      - run: npm run build
      - run: npm run db:migrate:prod
        env:
          DATABASE_URL: postgresql://drivewize_ci:drivewize_ci@localhost:5432/drivewize_ci
          MIGRATIONS_FOLDER: ${{ github.workspace }}/src/db/migrations

  docker:
    name: Docker build and scan
    runs-on: ubuntu-latest
    needs: [test-and-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          load: true
          tags: drivewize-backend:ci
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: migrate
          load: true
          tags: drivewize-backend:ci-migrate
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: drivewize-backend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
