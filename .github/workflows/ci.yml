name: CI

# Pull-request validation only. Production deploy runs on push to main
# via production-deploy.yml (includes its own CI gate).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  security-events: write

env:
  NODE_VERSION: "22.23.5"

jobs:
  secret-scan:
    name: Secret scan (working tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure credential files are not tracked
        run: |
          tracked="$(git ls-files -- .env .env.local .env.production .env.staging 'secrets/*' '*.pem' '*.key' '*.dump' || true)"
          if [ -n "$tracked" ]; then
            echo "Refusing to continue: credential/dump files are tracked:"
            echo "$tracked"
            exit 1
          fi
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
      - run: ./gitleaks detect --source . --no-git --redact --exit-code 1 -c .gitleaks.toml

  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    needs: [secret-scan]
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: drivewize_ci
          POSTGRES_PASSWORD: drivewize_ci
          POSTGRES_DB: drivewize_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drivewize_ci -d drivewize_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.12-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: "3000"
      DATABASE_URL: postgresql://drivewize_ci:drivewize_ci@localhost:5432/drivewize_ci
      REDIS_URL: redis://localhost:6379
      USE_REDIS: "true"
      JWT_SECRET: CHANGE_ME_CI_JWT_SECRET_AT_LEAST_32_CHARS_00
      BYPASS_AUTH: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Migrate disposable CI database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://drivewize_ci:drivewize_ci@localhost:5432/drivewize_ci
          MIGRATIONS_FOLDER: ${{ github.workspace }}/src/db/migrations
      - name: Verify CI schema (vehicles through color)
        run: |
          node <<'EOF'
          const postgres = require('postgres');
          (async () => {
            const sql = postgres(process.env.DATABASE_URL, { max: 1 });
            try {
              const [{ vehicles_table }] = await sql`select to_regclass('public.vehicles') as vehicles_table`;
              if (!vehicles_table) throw new Error('public.vehicles missing after migrate');
              const cols = await sql`
                select column_name from information_schema.columns
                where table_schema = 'public' and table_name = 'vehicles' and column_name = 'color'`;
              if (!cols.length) throw new Error('vehicles.color missing after migrate');
              const polyline = await sql`
                select column_name from information_schema.columns
                where table_schema = 'public' and table_name = 'bookings'
                  and column_name = 'route_encoded_polyline'`;
              if (!polyline.length) throw new Error('bookings.route_encoded_polyline missing after migrate');
              const [{ migration_rows }] = await sql`select count(*)::int as migration_rows from drizzle.__drizzle_migrations`;
              if (migration_rows < 41) throw new Error('expected >=41 drizzle migrations, got ' + migration_rows);
              console.log(JSON.stringify({ vehicles_table, color: true, route_encoded_polyline: true, migration_rows }));
            } finally {
              await sql.end({ timeout: 5 });
            }
          })().catch((err) => { console.error(err); process.exit(1); });
          EOF
      - run: npm test -- --runInBand --forceExit
      - run: npm run build

  docker:
    name: Docker build and scan
    runs-on: ubuntu-latest
    needs: [test-and-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          load: true
          tags: drivewize-backend:ci
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: migrate
          load: true
          tags: drivewize-backend:ci-migrate
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: drivewize-backend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
